server:
  port: 8091

spring:
  application:
    name: datastation-lite
  datasource:
    url: jdbc:h2:file:./data/datastation;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
